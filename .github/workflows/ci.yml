name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Make sure the raw M5 download is not tracked
        run: test -z "$(git ls-files data/raw)"
      - name: Run tests
        run: pytest -q
      - name: Re-run the policies on the saved forecasts (base capacity)
        run: python src/run_all.py --quick
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the browser demo against Python
        run: node web_demo/check_demo.cjs
